[package]
name = "sow-server"
version = "0.1.0"
edition = "2021"
description = "Shadows of War — Standalone turn-relay server"

[dependencies]
sow-core = { workspace = true }
sow-net = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
log = { workspace = true }
env_logger = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rand = "0.10.1"
brotli = "8.0.2"
axum = "0.8.9"
tower-http = { version = "0.6.10", features = ["fs", "compression-br"] }
