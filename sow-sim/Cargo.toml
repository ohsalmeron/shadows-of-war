[package]
name = "sow-sim"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
sow-core = { path = "../sow-core" }
wasm-bindgen = "0.2.100"
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
js-sys = "0.3.69"
log = "0.4"
console_log = "1.0"

[dependencies.web-sys]
version = "0.3.69"
features = [
    "WorkerGlobalScope",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
]
