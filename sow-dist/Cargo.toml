[package]
name = "sow-dist"
version = "0.1.0"
edition = "2021"
description = "Shadows of War — WASM dist build and deploy (prod, ptr, crazygames, local)"
license = "AGPL-3.0-or-later"

[[bin]]
name = "sow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dotenv = "0.15"
brotli = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
minifier = { workspace = true }
reqwest = { version = "0.11", features = ["blocking"] }
sha2 = "0.10"
walkdir = "2"
wasm-bindgen-cli-support = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
libc = "0.2"
wasm-opt = { workspace = true }
tempfile = { workspace = true }
