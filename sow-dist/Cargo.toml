[package]
name = "sow-dist"
version = "0.1.0"
edition = "2024"
description = "Shadows of War — Unified build & deploy orchestrator"
license = "AGPL-3.0-or-later"

[[bin]]
name = "sow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
brotli = { workspace = true }
minifier = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
walkdir = "2"
wasm-bindgen-cli-support = { workspace = true }
wasm-opt = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tower-http = { workspace = true }
sow-i18n = { workspace = true }
