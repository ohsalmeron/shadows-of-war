[package]
name = "sow-dist"
version = "0.1.0"
edition = "2021"
description = "Shadows of War — WASM dist build and deploy (prod, ptr, crazygames, local)"
license = "AGPL-3.0-or-later"

[[bin]]
name = "sow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true }
reqwest = { version = "0.11", features = ["blocking"] }
sha2 = "0.10"
walkdir = "2"
