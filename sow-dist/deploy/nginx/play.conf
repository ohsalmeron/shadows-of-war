server {
    server_name play.shadowsofwar.io;

    root /var/www/play.shadowsofwar.io/html;
    index index.html;

    brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    location = /sow.svg {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* ^/sow_client_[0-9]+(_bg)?\.(js|wasm)(\.br)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /game-manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/static/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/play.shadowsofwar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.shadowsofwar.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name play.shadowsofwar.io;

    # ACME HTTP-01 (certbot --webroot) before HTTPS cert exists
    location /.well-known/acme-challenge/ {
        root /var/www/play.shadowsofwar.io/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
