server {
    listen 80;
    server_name __SOW_DOMAIN_PLAY__;

    root /var/www/__SOW_DOMAIN_PLAY__/html;
    index index.html;

    add_header Content-Security-Policy "frame-ancestors 'self' https://__SOW_DOMAIN_MAIN__ https://__SOW_WWW_MAIN__ http://127.0.0.1:* http://localhost:*" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    location = /sow.svg {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* ^/sow_client_[0-9]+(_bg)?\.(js|wasm)(\.br)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /game-manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/static/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
