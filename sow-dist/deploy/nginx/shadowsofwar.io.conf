server {
    server_name shadowsofwar.io www.shadowsofwar.io;

    root /var/www/shadowsofwar.io/html;
    index index.html;

    brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    # Legacy privacy URL → static route
    location = /privacy.html {
        return 301 /privacy;
    }

    # Old /play URL → game subdomain root (no WASM shell on marketing host)
    location ~ ^/play(/.*)?$ {
        return 301 https://play.shadowsofwar.io/;
    }

    # Legacy marketing embed files (removed)
    location ~ ^/(boot\.js|sw\.js|game-manifest\.json)$ {
        return 410;
    }

    location = /sow.svg {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Canonical CDN paths (remote art: leaders + boot UI)
    location ~ ^/assets/cdn/leaders/(.+)$ {
        root /var/www/shadowsofwar.io/html;
        try_files /assets/cdn/leaders/$1 =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~ ^/assets/cdn/ui/(.+)$ {
        root /var/www/shadowsofwar.io/html;
        try_files /assets/cdn/ui/$1 =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Legacy URLs → canonical cdn/ (one release bridge; remove after VPS cleanup)
    location ~ ^/assets/streamed/(.+)$ {
        return 301 /assets/cdn/$1;
    }
    location ~ ^/assets/static/ui/(.+)$ {
        return 301 /assets/cdn/ui/$1;
    }
    location ~ ^/assets/ui/leaders/(.+)$ {
        return 301 /assets/cdn/leaders/$1;
    }
    location ~ ^/assets/ui/(.+)$ {
        return 301 /assets/cdn/ui/$1;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Marketing site (sow-web/site static HTML)
    location = /health {
        default_type text/plain;
        try_files /health =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    location = /terms {
        try_files /terms/index.html =404;
    }

    location = /site.css {
        add_header Cache-Control "public, max-age=3600";
        try_files /site.css =404;
    }

    # Proxy for ephemeral game relays
    location ~ ^/relay/(?<relay_port>\d+)/ws/ {
        proxy_pass http://127.0.0.1:$relay_port/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy for ephemeral lobbies
    location ~ ^/lobby/(?<lobby_port>\d+)/ws/ {
        proxy_pass http://127.0.0.1:$lobby_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy WebSockets for the game server
    location /ws/ {
        proxy_pass http://127.0.0.1:25565;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Maps API proxy — CORS is set by sow-server (tower_http); do not duplicate here.
    location /maps/ {
        proxy_pass http://127.0.0.1:25566/maps/;
        proxy_set_header Host $host;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shadowsofwar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shadowsofwar.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.shadowsofwar.io) {
        return 301 https://$host$request_uri;
    }

    if ($host = shadowsofwar.io) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name shadowsofwar.io www.shadowsofwar.io;
    return 404;
}
