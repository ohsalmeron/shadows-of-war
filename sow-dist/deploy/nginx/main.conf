geo $realip_remote_addr $is_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    # Cloudflare IPv6
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Define intruder log format
log_format intruder_format '$time_local - INTRUDER BLOCKED - IP: $realip_remote_addr - Host: $host - Request: "$request" - UA: "$http_user_agent"';

server {
    listen 443 ssl; # managed by Certbot
    server_name __SOW_DOMAIN_MAIN__ __SOW_WWW_MAIN__;

    # Cloudflare Real IP Restoration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    # Block and log direct-IP scanners
    if ($is_cloudflare = 0) {
        access_log /var/log/nginx/direct_ip_intruders.log intruder_format;
        return 444;
    }

    root /var/www/__SOW_DOMAIN_MAIN__/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    location = /privacy.html { return 301 /privacy; }

    location = /sow.svg {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "public, max-age=86400";
        try_files /sitemap.xml =404;
    }

    location ~ ^/assets/cdn/leaders/(.+)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~ ^/assets/cdn/ui/(.+)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~ ^/assets/cdn/avatars/(.+)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* ^/sow_client_[0-9]+(_bg)?\.(js|wasm)(\.br)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = / { try_files /index.html =404; }
    location = /privacy { try_files /privacy/index.html =404; }
    location = /terms { try_files /terms/index.html =404; }
    location = /wiki { try_files /wiki/index.html =404; }
    location = /play { try_files /play/index.html =404; }
    location = /site.css {
        add_header Cache-Control "public, max-age=3600";
        try_files /site.css =404;
    }

    location ~ ^/relay/(?<relay_port>255[7-9]\d|25[6-9]\d\d|26[0-4]\d\d|26500)/ws/ {
        proxy_pass http://127.0.0.1:$relay_port/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:__SOW_PROD_WS_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /maps/ {
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://127.0.0.1:__SOW_PROD_MAPS_PORT__/maps/;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:__SOW_PROD_MAPS_PORT__/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/(internal|match)/ {
        return 403;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Platform-Auth" always;
            return 204;
        }
        proxy_pass http://127.0.0.1:__SOW_PROD_DB_PORT__/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    ssl_certificate /etc/letsencrypt/live/shadowsofwar.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shadowsofwar.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = __SOW_DOMAIN_MAIN__) {
        return 301 https://$host$request_uri;
    }
    if ($host = __SOW_WWW_MAIN__) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name __SOW_DOMAIN_MAIN__ __SOW_WWW_MAIN__;
    return 404;
}
