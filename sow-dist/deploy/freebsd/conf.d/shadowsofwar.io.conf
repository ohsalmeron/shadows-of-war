server {
    listen 80;
    server_name shadowsofwar.io www.shadowsofwar.io ws.shadowsofwar.io 74.208.246.177;

    location = /internal/stats {
        return 404;
    }

    location ^~ /internal/ {
        allow __SOW_RELAY_DB_SOURCE_IP__;
        deny all;
        client_max_body_size 32m;
        proxy_pass http://__SOW_DB_LISTEN_HOST__:25585;
        include snippets/proxy-headers.conf;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shadowsofwar.io www.shadowsofwar.io ws.shadowsofwar.io;

    ssl_certificate     /usr/local/etc/letsencrypt/live/shadowsofwar.io/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/shadowsofwar.io/privkey.pem;
    include snippets/ssl-params.conf;

    root /srv/sow/current/web;
    index index.html;

    location ^~ /api/internal/ {
        return 404;
    }

    location ^~ /api/match/ {
        return 404;
    }

    location = /internal/stats {
        return 404;
    }

    location ^~ /internal/ {
        allow __SOW_RELAY_DB_SOURCE_IP__;
        deny all;
        client_max_body_size 32m;
        proxy_pass http://__SOW_DB_LISTEN_HOST__:25585;
        include snippets/proxy-headers.conf;
    }

    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://__SOW_DB_LISTEN_HOST__:25585/;
        include snippets/proxy-headers.conf;
    }

    location /ws/ {
        limit_conn sow_ws_connections 4096;
        limit_req zone=sow_ws_handshakes burst=512 nodelay;
        proxy_pass http://__SOW_SERVER_LISTEN_HOST__:25564;
        include snippets/proxy-websocket.conf;
    }

    location /maps/ {
        proxy_pass http://__SOW_SERVER_LISTEN_HOST__:25566/maps/;
        include snippets/proxy-headers.conf;
    }

    # Game shell: everything under /play/ is an SPA served from the webroot.
    location ^~ /play/ {
        try_files $uri $uri/ /play/index.html;
    }

    # Website + static CDN content; no SPA fallback, missing files are 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
