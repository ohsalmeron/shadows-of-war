server {
    listen 80;
    server_name shadowsofwar.io www.shadowsofwar.io ws.shadowsofwar.io play.shadowsofwar.io cdn.shadowsofwar.io 74.208.246.177;

    location = /internal/stats {
        return 404;
    }

    location ^~ /internal/ {
        allow __SOW_RELAY_DB_SOURCE_IP__;
        deny all;
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:25585;
        include snippets/proxy-headers.conf;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shadowsofwar.io www.shadowsofwar.io ws.shadowsofwar.io play.shadowsofwar.io cdn.shadowsofwar.io;

    ssl_certificate     /usr/local/etc/letsencrypt/live/shadowsofwar.io/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/shadowsofwar.io/privkey.pem;
    include snippets/ssl-params.conf;

    root /srv/sow/current/web;
    index index.html;

    location ^~ /api/internal/ {
        return 404;
    }

    location ^~ /api/match/ {
        return 404;
    }

    location = /internal/stats {
        return 404;
    }

    location ^~ /internal/ {
        allow __SOW_RELAY_DB_SOURCE_IP__;
        deny all;
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:25585;
        include snippets/proxy-headers.conf;
    }

    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://127.0.0.1:25585/;
        include snippets/proxy-headers.conf;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:25564;
        include snippets/proxy-websocket.conf;
    }

    location /maps/ {
        proxy_pass http://127.0.0.1:25566/maps/;
        include snippets/proxy-headers.conf;
    }

    location ^~ /admin/ {
        return 404;
    }

    location = / {
        try_files /play/index.html =404;
    }

    location / {
        try_files $uri $uri/ /play/index.html;
    }
}
