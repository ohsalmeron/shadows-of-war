worker_processes auto;

events {
    worker_connections 16384;
}

http {
    include /usr/local/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /srv/sow/current/web;
        index index.html;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /api/internal/ {
            return 404;
        }

        location ^~ /api/match/ {
            return 404;
        }

        location ^~ /internal/ {
            proxy_pass http://127.0.0.1:25585;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:25585/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:25564;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ "^/relay/(?<relay_port>2559[0-9]|25[6-9][0-9]{2}|26[0-4][0-9]{2}|26500)/ws/$" {
            proxy_pass http://127.0.0.1:$relay_port/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /maps/ {
            proxy_pass http://127.0.0.1:25566/maps/;
            proxy_set_header Host $host;
        }

        location ^~ /admin/ {
            return 404;
        }

        location = / {
            try_files /play/index.html =404;
        }

        location / {
            try_files $uri $uri/ /play/index.html;
        }
    }
}
