sow-server {
    host.hostname = "sow-server.local";
    path = /zroot/jails/sow-server;
    ip4 = inherit;
    ip6 = inherit;
    mount.devfs;
    devfs_ruleset = 4;
    mount.fstab = "/etc/fstab.sow-server";
    exec.clean;
    exec.start = "/bin/sh /etc/rc";
    exec.stop = "/bin/sh /etc/rc.shutdown jail";
    allow.set_hostname = 0;
    allow.sysvipc = 0;
    enforce_statfs = 2;
}
