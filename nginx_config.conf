server {
    server_name shadowsofwar.io www.shadowsofwar.io;

    root /var/www/shadowsofwar.io/html;
    index index.html;

    # Precompressed .br files from build (dist/*.br). Requires brotli static module:
    #   apt install libnginx-mod-http-brotli-static
    #   sudo nginx -t && sudo systemctl reload nginx
    brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    # Hashed wasm-bindgen bundles (filename includes build timestamp).
    location ~* ^/sow_client_[0-9]+(_bg)?\.(js|wasm)(\.br)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Loader splash / bar graphics.
    location ~* ^/assets/ui/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /sow.svg {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy for ephemeral game relays
    location ~ ^/relay/(?<relay_port>\d+)/ws/ {
        proxy_pass http://127.0.0.1:$relay_port/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy for ephemeral lobbies
    location ~ ^/lobby/(?<lobby_port>\d+)/ws/ {
        proxy_pass http://127.0.0.1:$lobby_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy WebSockets for the game server
    location /ws/ {
        proxy_pass http://127.0.0.1:25565;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400; # Keep connections alive
    }

    # Maps API Proxy
    location /maps/ {
        proxy_pass http://127.0.0.1:25566/maps/;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shadowsofwar.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shadowsofwar.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.shadowsofwar.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = shadowsofwar.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name shadowsofwar.io www.shadowsofwar.io;
    return 404; # managed by Certbot
}
