[workspace]
members = [
    "sow-core",
    "sow-render",
    "sow-net",
    "sow-client",
    "sow-server",
    "sow-ui",
    "sow-tools",
    "sow-relay",
    "sow-lang",
]
exclude = ["blade", "winit", "egui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.31.0-beta.2"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com"

[workspace.dependencies]
bincode = "1.3.3"
bitfield = "0.17"
env_logger = "0.11"
log = "0.4"
raw-window-handle = "0.6"
serde_json = "1"
web-time = "1.1"
wyrand = "0.2"
egui = "0.34"
egui_extras = { path = "egui/crates/egui_extras", default-features = false, features = ["svg"] }
image = { version = "0.25.10", default-features = false, features = ["webp"] }
sow-lang = { path = "sow-lang" }

[workspace.dependencies.blade-egui]
path = "blade/blade-egui"

[workspace.dependencies.blade-graphics]
path = "blade/blade-graphics"

[workspace.dependencies.blade-macros]
path = "blade/blade-macros"

[workspace.dependencies.bytemuck]
version = "1"
features = ["derive"]

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.sow-core]
path = "sow-core"

[workspace.dependencies.sow-net]
path = "sow-net"

[workspace.dependencies.sow-render]
path = "sow-render"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.deploy]
inherits = "release"
lto = false
codegen-units = 16
strip = true

[profile.wasm-release]
inherits = "deploy"
panic = "abort"

[patch.crates-io]
egui = { path = "egui/crates/egui" }
