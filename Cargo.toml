[workspace]
members = [
    "sow-core",
    "sow-render",
    "sow-net",
    "sow-client",
    "sow-server",
    "sow-ui",
    "sow-tools",
]
exclude = ["blade"]
resolver = "2"

[workspace.dependencies]
sow-core = { path = "sow-core" }
sow-render = { path = "sow-render" }
sow-net = { path = "sow-net" }

# Graphics
blade-graphics = { path = "blade/blade-graphics" }
blade-egui = { path = "blade/blade-egui" }
blade-macros = { path = "blade/blade-macros" }
raw-window-handle = "0.6"

# Deterministic RNG (replaces bevy_prng)
wyrand = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"

# Logging (replaces bevy::log)
log = "0.4"
env_logger = "0.11"

# Data structures
bitfield = "0.17"

# Math
bytemuck = { version = "1", features = ["derive"] }
web-time = "1.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.sow-core]
opt-level = 3
