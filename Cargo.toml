[workspace]
members = [
    "sow-audio",
    "sow-core",
    "sow-data",
    "sow-net",
    "sow-client",
    "sow-render",
    "sow-server",
    "sow-database",
    "sow-ui",
    "sow-tools",
    "sow-relay",
    "sow-i18n",
    "sow-map",
    "sow-dist",
]
exclude = ["blade", "winit", "egui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.0"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ohsalmeron/shadows-of-war"

[workspace.dependencies]
bincode = "1.3.3"
bitfield = "0.17"
env_logger = "0.11"
log = "0.4"
raw-window-handle = "0.6"
serde_json = "1"
web-time = "1.1"
wyrand = "0.2"
egui = { version = "0.34", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
sow-i18n = { path = "sow-i18n" }
sow-map = { path = "sow-map", default-features = false }
sow-ui = { path = "sow-ui" }
sha2 = "0.10"
winit = { version = "0.31.0-beta.2", features = ["android-native-activity"] }
brotli = "8.0.2"
crossbeam-channel = "0.5.15"
url = "2.5.8"
wasm-bindgen-futures = "0.4.72"
wasm-bindgen = "0.2.122"
wasm-bindgen-cli-support = "0.2.122"
minifier = "0.3.2"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1.7"
console_log = "1.0"
web-sys = { version = "0.3.69", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Navigator", "CssStyleDeclaration", "Node", "VisibilityState", "Location", "BinaryType", "Worker", "MessageEvent", "Storage"] }
js-sys = "0.3.69"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.20.1", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
redis = "0.27"
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
ehttp = { version = "0.5.0", default-features = false }
libm = "0.2.16"
axum = "0.8.9"
tower-http = { version = "0.6.10", features = ["fs", "compression-br", "cors"] }
futures-channel = "0.3"
open = "5.3"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
wasm-opt = "0.116"
tempfile = "3"

blade-egui = { path = "blade/blade-egui" }
blade-graphics = { path = "blade/blade-graphics" }
blade-macros = { path = "blade/blade-macros" }

[workspace.dependencies.bytemuck]
version = "1"
features = ["derive"]

[workspace.dependencies.serde]
version = "1"
features = ["derive", "rc"]

[workspace.dependencies.sow-audio]
path = "sow-audio"

[workspace.dependencies.sow-core]
path = "sow-core"

[workspace.dependencies.sow-data]
path = "sow-data"

[workspace.dependencies.sow-render]
path = "sow-render"

[workspace.dependencies.sow-net]
path = "sow-net"



[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.deploy]
inherits = "release"
lto = false
codegen-units = 16
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

