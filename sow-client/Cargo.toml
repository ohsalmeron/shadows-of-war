[package]
name = "sow-client"
version = "0.1.0"
edition = "2021"
description = "Shadows of War"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
dev = ["sow-client-world/dev"]

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
sow-client-world = { workspace = true }
winit = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }
