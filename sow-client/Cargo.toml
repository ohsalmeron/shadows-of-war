[package]
name = "sow-client"
version = "0.1.0"
edition = "2021"
description = "Shadows of War"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
sow-core = { workspace = true }
sow-render = { workspace = true }
sow-map = { workspace = true }
blade-graphics = { workspace = true }

log = { workspace = true }
env_logger = { workspace = true }
winit = { workspace = true }
sow-ui = { path = "../sow-ui" }
egui = "0.34"
egui_extras = { workspace = true }
blade-egui = { workspace = true }
serde_json.workspace = true
bincode.workspace = true
sow-net = { workspace = true }
brotli = { workspace = true }
ehttp = { version = "0.5.0", features = ["streaming"] }
crossbeam-channel = { workspace = true }
android_logger = "0.14"
web-time = { workspace = true }
image = { workspace = true }
md5 = "0.8.0"
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
wasm-bindgen = { workspace = true }
getrandom = { workspace = true, features = ["js"] }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Navigator", "CssStyleDeclaration", "Node", "VisibilityState", "Location", "BinaryType", "Worker", "MessageEvent", "Storage"] }
js-sys = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
libc = "0.2"

[package.metadata.android]
build_targets = ["aarch64-linux-android"]
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Shadows of War"

[package.metadata.android.application.activity]
label = "Shadows of War"
exported = true
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.signing.release]
path = "../keystores/release.keystore"
keystore_password = "shadowswar"
key_password = "shadowswar"
key_alias = "shadows"
