[package]
name = "sow-client"
version = "0.1.0"
edition = "2021"
description = "Shadows of War — Native Desktop Client"

[dependencies]
sow-core = { workspace = true }
sow-render = { workspace = true }
blade-graphics = { workspace = true }

log = { workspace = true }
env_logger = { workspace = true }
winit = "0.29.15"
sow-ui = { path = "../sow-ui" }
egui = "0.34"
blade-egui = { workspace = true }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread"] }
serde_json.workspace = true
sow-net = { workspace = true }
brotli = "8.0.2"
ureq = "2"
crossbeam-channel = "0.5.15"
