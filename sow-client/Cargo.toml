[package]
name = "sow-client"
version.workspace = true
edition = "2021"
description = "Shadows of War — main game client (simulation host, event loop, platform integrations)"
license = "AGPL-3.0-or-later"

[package.metadata.deb]
maintainer = "ohsalmeron <ohsalmeron@users.noreply.github.com>"
extended-description = "Shadows of War — a multiplayer strategy game"
depends = "$auto"
section = "game"
priority = "optional"
assets = [
    ["target/release/client", "usr/bin/shadows-of-war", "755"],
]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
dev = ["sow-ui/dev"]

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
sow-audio = { workspace = true }
sow-core = { workspace = true }
sow-data = { workspace = true }
sow-render = { workspace = true }
sow-ui = { workspace = true }
sow-i18n = { workspace = true }
sow-net = { workspace = true }
log = { workspace = true }
winit = { workspace = true }
egui = { workspace = true }
bincode.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
brotli = { workspace = true }
ehttp = { workspace = true, features = ["streaming"] }
crossbeam-channel = { workspace = true }
web-time = { workspace = true }
image = { workspace = true }
url = { workspace = true }
blade-graphics = { git = "https://github.com/ohsalmeron/blade", subdir = "blade-graphics" }
blade-macros = { git = "https://github.com/ohsalmeron/blade", subdir = "blade-macros" }
blade-egui = { git = "https://github.com/ohsalmeron/blade", subdir = "blade-egui" }
bytemuck = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
wasm-bindgen = { workspace = true }
getrandom = { workspace = true, features = ["js"] }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "HtmlCanvasElement", "Navigator", "CssStyleDeclaration", "Node", "VisibilityState", "Location", "BinaryType", "Worker", "MessageEvent", "Storage", "MediaQueryList", "Blob", "Url", "BlobPropertyBag", "VisualViewport", "Event"] }
js-sys = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }
open = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true }
