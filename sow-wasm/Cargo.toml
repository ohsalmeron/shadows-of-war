[package]
name = "sow-wasm"
version = "0.1.0"
edition = "2021"
description = "Shadows of War — WebAssembly entry point"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sow-core = { workspace = true }
sow-render = { workspace = true }
sow-net = { workspace = true }
log = { workspace = true }
wasm-bindgen = "=0.2.118"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
console_error_panic_hook = "0.1.7"
