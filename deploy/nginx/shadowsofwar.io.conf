server {
    server_name shadowsofwar.io www.shadowsofwar.io;

    root /var/www/shadowsofwar.io/html;
    index index.html;

    brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    # Legacy privacy URL → SSR route
    location = /privacy.html {
        return 301 /privacy;
    }

    # Legacy /play paths → fullscreen game subdomain
    location = /play/index.html {
        return 301 https://play.shadowsofwar.io/;
    }

    location = /play {
        return 301 https://play.shadowsofwar.io/;
    }

    location = /play/ {
        return 301 https://play.shadowsofwar.io/;
    }

    location /play/ {
        return 301 https://play.shadowsofwar.io/;
    }

    location = /sow.svg {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SSR landing + legal (sow-site)
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location = / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /privacy {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location = /terms {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    # Proxy for ephemeral game relays
    location ~ ^/relay/(?<relay_port>\d+)/ws/ {
        proxy_pass http://127.0.0.1:$relay_port/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy for ephemeral lobbies
    location ~ ^/lobby/(?<lobby_port>\d+)/ws/ {
        proxy_pass http://127.0.0.1:$lobby_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy WebSockets for the game server
    location /ws/ {
        proxy_pass http://127.0.0.1:25565;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Maps API proxy — CORS is set by sow-server (tower_http); do not duplicate here.
    location /maps/ {
        proxy_pass http://127.0.0.1:25566/maps/;
        proxy_set_header Host $host;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shadowsofwar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shadowsofwar.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.shadowsofwar.io) {
        return 301 https://$host$request_uri;
    }

    if ($host = shadowsofwar.io) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name shadowsofwar.io www.shadowsofwar.io;
    return 404;
}
