# HTTP-only play host — used until play.shadowsofwar.io TLS cert exists (certbot).
# sow.sh switches to play.conf after ensure_play_tls_cert.

server {
    listen 80;
    server_name play.shadowsofwar.io;

    root /var/www/play.shadowsofwar.io/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/play.shadowsofwar.io/html;
        try_files $uri =404;
    }

    location ~* ^/sow_client_[0-9]+(_bg)?\.(js|wasm)(\.br)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/static/ui/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
