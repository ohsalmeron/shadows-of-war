server {
    server_name ptr.shadowsofwar.io;

    root /var/www/ptr.shadowsofwar.io/html;
    index index.html;

    brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    location = /sow.svg {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* ^/sow_client_[0-9]+(_bg)?\.(js|wasm)(\.br)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /game-manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ui/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:25575;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /maps/ {
        proxy_pass http://127.0.0.1:25576/maps/;
        proxy_set_header Host $host;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ptr.shadowsofwar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptr.shadowsofwar.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name ptr.shadowsofwar.io;
    return 301 https://$host$request_uri;
}
