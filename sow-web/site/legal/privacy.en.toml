title = "Shadows of War — Privacy Policy"
updated = "Last updated: August 2026"
close = "CLOSE"

[[sections]]
heading = "Overview"
paragraphs = [
  "Shadows of War is a multiplayer strategy game. This policy describes what data we process when you play on shadowsofwar.io. If the game is later published through a partner platform, that platform may apply its own privacy policy and SDK rules.",
]

[[sections]]
heading = "Data we collect"
bullets = [
  "Gameplay: Display name, clan tag, leader/civilization choices, and match inputs required for lockstep multiplayer.",
  "Technical: Client build version, WebSocket connection metadata, and basic server logs for abuse prevention.",
  "Product analytics: Anonymous usage events (boot, tutorial progress, match start/end) tied to a random session identifier and your account ID. We use them to measure funnels such as where new players stop; they contain no advertising identifiers.",
  "Partner platforms: If the game is later published through a partner platform, its SDK may collect analytics under its own policy. We do not sell personal data.",
]

[[sections]]
heading = "Local storage"
paragraphs = [
  "The client may use browser local storage for settings and cached map assets. No third-party advertising trackers are embedded in the client.",
]

