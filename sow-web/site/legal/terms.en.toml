paragraphs = [
  "The in-game store sells virtual items only: gem bundles, leader unlocks, and skins. Virtual items are a limited, non-transferable, revocable license to use content inside the Service. They have no cash or monetary value, cannot be redeemed for money, and cannot be transferred, sold, gifted, or traded between accounts.",
  "Leader unlocks change gameplay: unlocked leaders have distinct perks and abilities and are not purely cosmetic. The free weekly rotation described in-game is subject to change at our discretion.",
  "ALL SALES ARE FINAL. Virtual items are non-refundable and non-replaceable to the fullest extent permitted by law. We do not grant refunds, chargeback accommodations, or replacements for used, consumed, lost, or unwanted items, for account suspension or termination resulting from your violation of these Terms, or for changes to the Service, rotation, prices, or item attributes.",
  "Purchases are processed by the platform you buy through (Google Play, Apple App Store, Stripe, or another listed provider); taxes and payment terms are set by that platform. If a platform reverses or charges back a purchase despite this policy, we may remove the corresponding virtual items and take account measures, including suspension, to keep the game economy intact.",
]

[[sections]]
heading = "Player conduct"
paragraphs = [
  "Play to win — but play fair. Violations may result in content removal, match forfeiture, or account suspension or termination at our sole discretion.",
]
bullets = [
  "Do not cheat, use bots, macros, or automation, exploit bugs for unfair advantage, or intentionally desynchronize matches.",
  "Do not harass, threaten, hate-bait, or dox other players. Usernames, clan tags, and chat must not violate applicable law or platform rules.",
  "Do not disrupt servers, probe or attack infrastructure, attempt to access other players' accounts, or steal, harvest, or reverse-engineer credentials or tickets.",
  "Do not upload unlawful, infringing, or abusive content, and do not encourage others to break these rules.",
]

