  "The arbitrator may award only individual relief. YOU AND THE COMPANY WAIVE ANY RIGHT TO A JURY TRIAL AND TO PARTICIPATE IN ANY CLASS, COLLECTIVE, OR REPRESENTATIVE PROCEEDING. If a court finds the class waiver unenforceable for a specific claim, that claim will proceed in the state or federal courts of Delaware and all other claims remain in arbitration.",
