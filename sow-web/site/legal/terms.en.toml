[[sections]]
heading = "Accounts"
paragraphs = [
  "Anonymous play creates a canonical account ID stored on your device together with a display name. Clearing site storage creates a new account; renames never change the account ID. Your account ID is a progress lookup key, not a password — do not share it, and keep your device secure.",
  "Verified platform identities and persistent bot accounts are separate provider cases linked to the same account system. You are responsible for all activity under your account. Notify us promptly at hello@shadowsofwar.io if you believe your account was accessed without authorization.",
  "You may stop using the Service at any time by deleting local data or requesting erasure as described in our Privacy Policy. We may suspend or terminate accounts as described in the Termination section.",
]

