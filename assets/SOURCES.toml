# Asset provenance tracker for Shadows of War.
# Layout: assets/static/ (repo maps/fonts/HUD sources), assets/cdn/ (prod HTTP only).
# source: placeholder | original | ai_generated | google_fonts | svg_repo

[game_icons_owned]
path = "assets/static/icons/"
source = "original"
license = "AGPL-3.0-or-later"
files = ["factory.svg", "port.svg", "defense_post.svg", "atombomb.png"]
notes = "Original Shadows of War art restored from pre-wipe commit."

[game_icons_placeholder]
path = "assets/static/icons/"
source = "placeholder"
license = "AGPL-3.0-or-later"
files = [
  "city.svg",
  "missile_silo.svg",
  "trade_ship.png",
  "transport_ship.png",
  "battleship.png",
  "star.webp",
  "handshake.svg",
  "sam_missile.png",
]
notes = "Themed procedural placeholders (gradients/icons) in-repo."

[hud_icons]
path = "assets/static/ui/hud/"
source = "placeholder"
license = "AGPL-3.0-or-later"

[splash]
path = "assets/static/ui/"
source = "ai_generated"
tool = "Gemini / Meta AI / Midjourney (mixed, historical)"
license = "Per tool Terms of Service — verify redistribution rights"
status = "pending_tos_review"
files = ["sow-splash-desktop.webp", "sow-splash-mobile.webp"]
notes = "Published to assets/cdn/ui/ on CDN sync (resized via copy_static_ui_webp)."

[loaders]
path = "assets/static/ui/"
source = "placeholder"
license = "AGPL-3.0-or-later"
files = ["loader_empty.webp", "loader_full.webp"]
status = "themed_placeholder"
notes = "Served from assets/cdn/ui/ on shadowsofwar.io (not bundled in portal zip)."

