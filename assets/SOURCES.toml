# Asset provenance tracker for Shadows of War.
# Layout: assets/static/ (compile-time embed: fonts, icons, one offline map),
#         assets/maps/ (online map library → VPS /maps/ API),
#         assets/cdn/ (prod HTTP art only).
# source: placeholder | original | ai_generated | google_fonts | svg_repo

[hud_icons]
path = "assets/static/ui/hud/"
source = "placeholder"
license = "AGPL-3.0-or-later"

[splash]
path = "assets/static/ui/"
source = "ai_generated"
tool = "Gemini / Meta AI / Midjourney (mixed, historical)"
license = "Per tool Terms of Service — verify redistribution rights"
status = "pending_tos_review"
files = ["sow-splash-desktop.webp", "sow-splash-mobile.webp"]
notes = "Published to assets/cdn/ui/ on CDN sync (resized via copy_static_ui_webp)."

[loaders]
path = "assets/static/ui/"
source = "placeholder"
license = "AGPL-3.0-or-later"
files = ["loader_empty.webp", "loader_full.webp"]
status = "themed_placeholder"
notes = "Served from assets/cdn/ui/ on shadowsofwar.io (not bundled in portal zip)."

[avatars]
path = "assets/cdn/avatars/"
source = "ai_generated"
tool = "Gemini / Meta AI / Midjourney (mixed, historical)"
license = "CC-BY-SA-4.0"
license_doc = "docs/legal/LICENSE-ASSETS"
ai_dossier = "docs/leaders/README.md (prompts and roster; provide to Poki/CrazyGames on request)"
notes = "Streamed from CDN; canonical tree assets/cdn/avatars/. Not bundled in portal wasm."

[leader_portraits]
path = "assets/cdn/leaders/"
source = "ai_generated"
tool = "Gemini / Meta AI / Midjourney (mixed, historical)"
license = "CC-BY-SA-4.0"
license_doc = "docs/legal/LICENSE-ASSETS"
ai_dossier = "docs/leaders/README.md"
notes = "Streamed from CDN; not bundled in portal upload."
restored = [
  "alexander",
  "caesar",
  "cleopatra",
  "genghis_khan",
  "ragnar",
  "sun_tzu",
]
themed_placeholder = [
  "boudica",
  "leonidas",
  "napoleon",
  "richard_the_lionheart",
  "vercingetorix",
  "lady_six_sky",
]


[fonts]
path = "assets/static/fonts/"
source = "google_fonts"
license = "SIL Open Font License 1.1"
files = ["WorkSans-Black.ttf"]

[emoji_atlas]
path = "assets/static/emoji/"
source = "twemoji"
license = "CC-BY-4.0"
upstream = "https://github.com/twitter/twemoji"
pin = "14.0.2"
files = ["atlas.webp"]
notes = "Curated glyphs packed by sow-tools pack-emoji-atlas from Twemoji 72x72 PNGs (downscaled to 64px cells). Rebuild: cargo run -p sow-tools --bin sow-tools -- pack-emoji-atlas"

[maps_offline]
path = "assets/static/maps/world/"
source = "image"
notes = "Single offline-bundled map (WASM include_bytes). Online library: assets/maps/."

[maps_online]
path = "assets/maps/"
notes = "Map editor + sow-tools output; rsync to VPS SOW_MAPS_ROOT. Only world/ tracked in git."
