# Asset provenance tracker for Shadows of War.
# source: placeholder | original | ai_generated | google_fonts | svg_repo

[game_icons_owned]
path = "sow-client/assets/"
source = "original"
license = "AGPL-3.0-or-later"
files = ["factory.svg", "port.svg", "defense_post.svg", "atombomb.png"]
notes = "Original Shadows of War art restored from pre-wipe commit."

[game_icons_placeholder]
path = "sow-client/assets/"
source = "placeholder"
license = "AGPL-3.0-or-later"
files = [
  "city.svg",
  "missile_silo.svg",
  "trade_ship.svg",
  "transport_ship.svg",
  "battleship.svg",
  "star.webp",
  "handshake.svg",
  "sam_missile.png",
]
notes = "Themed procedural placeholders (gradients/icons) from scripts/generate_placeholder_assets.py."

