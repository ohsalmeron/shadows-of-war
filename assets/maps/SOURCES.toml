# Online map library (rsync → VPS SOW_MAPS_ROOT, served at /maps/).
# Additional map folders here are gitignored; only `world/` is tracked as the seed map.
# Each folder carries info.toml with its weighted-rotation frequency
# (OpenFront `multiplayer_frequency`; 0 = out of rotation).
# The `[recipes.<map>]` tables below keep provenance and artifact hashes for the
# generated map library even though the binary map folders remain ignored.

[world]
source = "openfront_image"
attribution = "Derived from a world-map heightmap image (OpenFront MapGenerator asset)."
notes = "Generated via the Rust image pipeline from the pinned OpenFront authoring image. This is the single canonical map source: the online map service serves it and the WASM client embeds world/map.bin.br directly from this tree."
