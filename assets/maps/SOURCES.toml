target_height = 1020
pipeline = "sow-map::image_pipeline::generate_from_rgba"
pipeline_revision = "nearest-input-v1/cardinal-runtime-v1"
water_connectivity = "cardinal-4"
small_island_policy = "remove-under-30-source-tiles"
small_lake_policy = "preserve-all"
