[package]
name = "sow-data"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
server = [
    "dep:tokio",
    "dep:axum",
    "dep:tower-http",
    "dep:log",
    "dep:env_logger",
    "dep:rand",
    "dep:redis",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:redb",
    "dep:serde_json",
    "dep:bincode",
    "dep:blake3",
    "dep:lettre",
]

[[bin]]
name = "sow-database"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["full"] }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["cors"] }
log = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
redis = { workspace = true, optional = true, features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = { version = "9", optional = true }
reqwest = { workspace = true, optional = true, features = ["json"] }
bincode = { workspace = true, optional = true }
blake3 = { version = "1", optional = true }
redb = { version = "2.1", optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }

[dev-dependencies]
tempfile = { workspace = true }
