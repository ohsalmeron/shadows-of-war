server {
    server_name ptr.shadowsofwar.io;

    root /var/www/ptr.shadowsofwar.io/html;
    index index.html;

    brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    location = /privacy.html {
        return 301 /privacy;
    }

    location = /play/index.html {
        return 301 /;
    }

    location = /play {
        return 301 /;
    }

    location = /sow.svg {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /boot.js {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* ^/play/sow_client_[0-9]+(_bg)?\.(js|wasm)(\.br)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /play/game-manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /play/loader.js {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* ^/play/assets/ui/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /play/sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /play/ {
        return 301 /;
    }

    location /play/ {
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }

    location = / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /privacy {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }

    location = /terms {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }

    location ~ ^/relay/(?<relay_port>\d+)/ws/ {
        proxy_pass http://127.0.0.1:$relay_port/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location ~ ^/lobby/(?<lobby_port>\d+)/ws/ {
        proxy_pass http://127.0.0.1:$lobby_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:25575;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /maps/ {
        proxy_pass http://127.0.0.1:25576/maps/;
        proxy_set_header Host $host;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ptr.shadowsofwar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptr.shadowsofwar.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name ptr.shadowsofwar.io;
    return 301 https://$host$request_uri;
}
