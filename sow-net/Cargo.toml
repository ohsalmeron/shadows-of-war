[package]
name = "sow-net"
version = "0.1.0"
edition = "2024"
description = "Shadows of War — Pure WebSocket networking and turn relay protocol"
license = "AGPL-3.0-or-later"

[dependencies]
sow-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
log = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
tokio = { workspace = true, features = ["net"] }
# Apple-native TLS keeps iOS transport encryption in the OS Security framework.
# This is intentionally scoped to iOS; FreeBSD/Linux and other native builds
# retain the existing Rustls implementation.
tokio-tungstenite = { workspace = true, features = ["connect", "native-tls"] }
futures-util = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
futures-channel = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
