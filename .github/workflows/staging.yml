name: Staging Build

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: python3 sow-tools/check_file_sizes.py

  build-web:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - name: Build web target
        run: cargo build --release -p sow-client --target wasm32-unknown-unknown
      - name: Generate wasm bindings
        run: |
          cargo install wasm-bindgen-cli --quiet
          wasm-bindgen --out-dir dist --target web target/wasm32-unknown-unknown/release/sow-client.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: staging-web
          path: dist/*
