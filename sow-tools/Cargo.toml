[package]
name = "sow-tools"
version = "0.1.0"
edition = "2021"
description = "Shadows of War — Map generator and tooling CLI"

[[bin]]
name = "test-relay"
path = "src/test_relay.rs"

[[bin]]
name = "bot-manager"
path = "src/bot_manager.rs"

[[bin]]
name = "generate-tutorial"
path = "src/bin/generate_tutorial.rs"

[dependencies]
sow-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
geo = "0.28"
geo-types = "0.7"
bincode = "1.3"
clap = { version = "4.4", features = ["derive"] }
env_logger = { workspace = true }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rand = "0.8"
brotli = "8.0.2"
