[package]
name = "sow-tools"
version = "0.1.0"
edition = "2024"
description = "Shadows of War — Map generator and tooling CLI"
license = "AGPL-3.0-or-later"

[[bin]]
name = "test-relay"
path = "src/test_relay.rs"

[[bin]]
name = "migrate-maps"
path = "src/bin/migrate_maps.rs"

[[bin]]
name = "write-play-catalog"
path = "src/bin/write_play_catalog.rs"

[[bin]]
name = "generate-font-atlas"
path = "src/bin/generate_font_atlas.rs"

[[bin]]
name = "sow-top"
path = "src/bin/sow_top.rs"

[dependencies]
sow-core = { workspace = true }
sow-map = { workspace = true, features = ["generator", "osm"] }
serde = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["net"] }
reqwest = { workspace = true, features = ["blocking"] }
bincode.workspace = true
clap = { workspace = true }
env_logger = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
brotli = { workspace = true }
ab_glyph = "0.2"
ctrlc = "3.4"
