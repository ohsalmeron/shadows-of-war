[package]
name = "sow-tools"
version = "0.1.0"
edition = "2021"
description = "Shadows of War — Map generator and tooling CLI"

[dependencies]
sow-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
geo = "0.28"
geo-types = "0.7"
bincode = "1.3"
clap = { version = "4.4", features = ["derive"] }
env_logger = { workspace = true }
